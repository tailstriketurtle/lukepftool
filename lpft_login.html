<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUKEPFTOOL - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #070b10;
            background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('login_background.jpg');
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #fff;
        }
        .login-container { width: 100%; max-width: 440px; padding: 0 20px; text-align: center; }
        h1 {
            font-family: 'Syne', sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: 3px; font-size: 2rem; margin-bottom: 2rem;
            background: linear-gradient(135deg, #64b5f6, #2196f3);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .login-card {
            background: linear-gradient(135deg, rgba(18, 22, 28, 0.65), rgba(12, 15, 20, 0.75)); 
            padding: 3.5rem 2.5rem; border-radius: 20px;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255,255,255,0.04);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }
        h2 { font-family: 'Syne', sans-serif; font-size: 1.25rem; text-transform: uppercase; margin-bottom: 3rem; opacity: 0.9; letter-spacing: 1px; }
        .form-group { position: relative; margin-bottom: 2.2rem; border-bottom: 1px solid rgba(255,255,255,0.15); display: flex; }
        .form-group:focus-within { border-bottom-color: #2196f3; }
        input { width: 100%; background: none; border: none; outline: none; padding: 10px 30px 10px 0; color: #fff; font-size: 0.95rem; font-weight: 300; }
        input::placeholder { color: rgba(255,255,255,0.3); }
        i { position: absolute; right: 5px; bottom: 12px; color: rgba(255,255,255,0.35); font-size: 0.9rem; transition: 0.3s; }
        .form-group:focus-within i { color: #2196f3; transform: scale(1.05); }
        .register-link { font-size: 0.85rem; color: rgba(255,255,255,0.45); margin-bottom: 3rem; }
        .register-link a { 
            background: linear-gradient(135deg, #64b5f6, #2196f3); 
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; 
            text-decoration: none; font-weight: 600; 
        }
        .login-btn {
            background: linear-gradient(135deg, #64b5f6, #2196f3); color: #070b10; border: none; width: 100%; max-width: 220px;
            padding: 0.85rem; font-weight: 600; font-size: 0.95rem; cursor: pointer; border-radius: 30px; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(33, 150, 243, 0.2);
        }
        .login-btn:hover { transform: translateY(-1px); filter: brightness(1.08); box-shadow: 0 8px 25px rgba(33, 150, 243, 0.35); }
    </style>
</head>
<body>

    <div class="login-container">
        <h1>LUKEPFTOOL</h1>
        <div class="login-card">
            <h2>Sign In</h2>
            <form action="lpft_onboard.html" method="POST" novalidate>
                <div class="form-group">
                    <input type="text" placeholder="Username or email" autocomplete="off">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="form-group">
                    <input type="password" placeholder="Password">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <div class="register-link">
                    Need an account? <a href="lpft_register.html">Register here</a>
                </div>
                <button type="submit" class="login-btn">Login</button>
            </form>
        </div>
    </div>

</body>
</html>
