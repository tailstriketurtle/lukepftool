<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUKEPFTOOL - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #070b10;
            background-image: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('register_background.jpg');
            background-position: center;
            background-size: cover;
            background-attachment: fixed;
            color: #fff;
        }
        .login-container { width: 100%; max-width: 440px; padding: 0 20px; text-align: center; }
        
        h1 {
            font-family: 'Syne', sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: 3px; font-size: 2rem; margin-bottom: 2rem;
            background: linear-gradient(135deg, #64b5f6, #2196f3);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .login-card {
            background: linear-gradient(135deg, rgba(18, 22, 28, 0.65), rgba(12, 15, 20, 0.75)); 
            padding: 3.5rem 2.5rem; border-radius: 20px;
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); 
            border: 1px solid rgba(255,255,255,0.04);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
        }
        
        /* Updated h2 layout properties to match the exact font profile of the Login page */
        h2 { 
            font-family: 'Syne', sans-serif; 
            font-size: 1.25rem; 
            text-transform: uppercase; 
            margin-bottom: 2rem; 
            opacity: 0.9; 
            letter-spacing: 1px; 
        }
        
        .inop-box {
            background: rgba(239, 83, 80, 0.1);
            border: 1px solid rgba(239, 83, 80, 0.4);
            color: #ff8a80;
            padding: 1.25rem; border-radius: 12px; margin-bottom: 2.5rem;
            font-size: 0.95rem; font-weight: 500;
            display: flex; align-items: center; justify-content: center; gap: 12px;
        }
        .inop-box i { color: #ef5350; }
        
        .register-link { font-size: 0.85rem; color: rgba(255,255,255,0.45); }
        .register-link a { 
            background: linear-gradient(135deg, #64b5f6, #2196f3); 
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none; font-weight: 600; 
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h1>LUKEPFTOOL</h1>
        <div class="login-card">
            <h2>Registration</h2>
            <div class="inop-box">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span>Sorry. This page is INOP.</span>
            </div>
            <div class="register-link">
                Already have an account? <a href="lpft_login.HTML">Sign In</a>
            </div>
        </div>
    </div>
</body>
</html>
